name: Deploy to Surge

on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Version Sync
        run: node scripts/validate-version-sync.mjs

      - name: Build installer and deploy to Surge
        run: node scripts/deploy-update.mjs --domain tpvelite.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
